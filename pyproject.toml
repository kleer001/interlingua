[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interlingua"
version = "0.1.0"
description = "TODO: describe interlingua"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kleer001" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
slice = [
  "sae-lens",
  "torch",
  "transformers",
  "huggingface_hub[cli]",
  "numpy",
  "scikit-learn",
  "networkx",
  "pyvis",
  "httpx",
  "matplotlib",
]
anchors = [
  "httpx",
  "beautifulsoup4",
  "lxml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/conlang"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
